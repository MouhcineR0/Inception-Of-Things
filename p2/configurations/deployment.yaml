# App-1

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1-pods # manages pods that contains this label name
  template:
    metadata:
      labels:
        app: app1-pods
    spec:
      containers:
        - name: app1-container
          image: hashicorp/http-echo:0.2.3
          args:
          - "-text=Hello from app1 -.-"
          ports:
          - containerPort: 5678
---

